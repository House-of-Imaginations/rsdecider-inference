# Run from this folder: docker compose up --build
# No models yet and no `download` URL? Once: docker compose --profile export up models-export
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
  rsdecider:
    build:
      context: ..
      dockerfile: self-hosted/Dockerfile
    depends_on: [redis]
    # Dockerfile CMD plus --download-models: fetches missing models from their `download` URL on start.
    command: ["serve", "--config", "/etc/rsdecider/rsdecider.toml", "--download-models"]
    ports: ["3000:3000", "127.0.0.1:9000:9000"]
    restart: unless-stopped
    stop_grace_period: 15s
    volumes:
      - ../models:/models
      - ./rsdecider.toml:/etc/rsdecider/rsdecider.toml:ro
  prometheus:
    image: prom/prometheus:v2.55.1
    depends_on: [rsdecider]
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana:11.3.1
    depends_on: [prometheus]
    restart: unless-stopped
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
  # Opt-in: docker compose --profile export up models-export. Exports only the models whose model.onnx is missing.
  models-export:
    image: python:3.11-slim
    profiles: ["export"]
    working_dir: /src
    volumes:
      - ../tools:/src/tools:ro
      - ../models:/models
      - hf-cache:/root/.cache/huggingface
    command:
      - sh
      - -c
      - |
        set -e
        need=""
        [ -f /models/english/model.onnx ] || need="$$need english"
        [ -f /models/multilingual/model.onnx ] || need="$$need multilingual"
        if [ -z "$$need" ]; then echo "models present, nothing to export"; exit 0; fi
        pip install --no-cache-dir -q --extra-index-url https://download.pytorch.org/whl/cpu -r tools/requirements.txt
        for m in $$need; do
          if [ "$$m" = english ]; then python tools/export_onnx.py --out /models/english
          else python tools/export_onnx.py --subfolder multilingual --out /models/multilingual; fi
        done

volumes:
  hf-cache:
