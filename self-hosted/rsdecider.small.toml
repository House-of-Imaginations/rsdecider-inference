# 2-4 vCPU / 4 GB minimum; model paths point at w8 (8-bit weight-only) exports — smaller files and lower peak RSS
# than fp32, see README > Small machines for measured numbers. Export with:
#   python tools/export_onnx.py --out models/english-w8 --quantize w8
#   python tools/export_onnx.py --subfolder multilingual --out models/multilingual-w8 --quantize w8
# No w8 export yet? Point path at /models/english or /models/multilingual (fp32) instead.
# Same mount layout as self-hosted/rsdecider.toml. ort_global_threads = 2 works for 2-4 vCPU boxes; the startup
# thread-budget warning is expected on this profile (it counts the worst case: both models running at once, plus
# the mostly idle HTTP and tokenize threads).
[server]
listen = "0.0.0.0:3000"
metrics_listen = "0.0.0.0:9000"
worker_threads = 1
tokenize_threads = 1

[limits]
max_batch_states = 4
max_questions_per_state = 8

[routing]
english_model = "english"
non_english_model = "multilingual"

[[models]]
name = "english"
path = "/models/english-w8"
workers = 1
max_pending = 32
max_batch_items = 4
max_batch_tokens = 2048

[[models]]
name = "multilingual"
path = "/models/multilingual-w8"
workers = 1
max_pending = 32
max_batch_items = 4
max_batch_tokens = 2048

[cache]
redis_url = "redis://redis:6379"

# Advanced limits (src/knobs.rs); these are the defaults except ort_global_threads.
[knobs]
# tokenize_queue = 512                  # requests tokenizing or waiting → 529 when full (default Σ max_pending)
overloaded_retry_after_secs = 1         # Retry-After on 529
redis_timeout_ms = 250                  # per Redis command (compose network); then miss / local idempotency
idempotency_local_max_bytes = 67108864  # fallback store when Redis is down (64 MiB)
idempotency_max_stored_bytes = 262144   # larger responses re-run on repeat (256 KiB)
ort_global_threads = 2                  # one shared ORT intra-op pool for both sessions

[[keys]]
name = "dev"
sha256 = "7e9f8fd111802be56c379d597842e29b2cebd35ff2133d431a49fa556a18704e"
rps = 50
burst = 100

[[keys]]
name = "stress"
sha256 = "6a3c65679a6c247316cbd7301e5677b16f96838401263c2c35727dfe989ffb8d"
rps = 100000
burst = 100000
