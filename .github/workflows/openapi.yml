name: openapi

# light check: every push on every branch (its result also shows on the PR)
on:
  push:
    branches: ['**']
    paths: ['openapi.yaml', '.github/workflows/openapi.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npx --yes @redocly/cli@2.53.3 lint openapi.yaml
