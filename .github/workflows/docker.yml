name: docker

# image build: main only (or run by hand from the Actions tab)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['self-hosted/**', 'src/**', 'openapi.yaml', 'Cargo.toml', 'Cargo.lock', '.github/workflows/docker.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f self-hosted/docker-compose.yml config --quiet
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: self-hosted/Dockerfile
          push: false
          load: true
          tags: rsdecider:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # the image must carry a runnable binary (and ORT's shared library if the build produced one)
      - run: docker run --rm rsdecider:ci hash-key ci
