name: fmt

# light check: every push on every branch (its result also shows on the PR)
on:
  push:
    branches: ['**']
    paths: ['**.rs', 'rustfmt.toml', '.github/workflows/fmt.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all --check
